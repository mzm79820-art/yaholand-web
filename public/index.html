<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a3a2f" />
  <title>야호랜드</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="phone">
    <header class="top">
      <div class="top-left">
        <button type="button" id="notifyBtn" class="notify-btn hidden" aria-label="알림" title="알림">
          🔔
          <span id="notifyBadge" class="notify-badge hidden">0</span>
        </button>
        <div class="brand">야호랜드</div>
      </div>
      <div class="top-right">
        <div class="bgm-ctrl">
          <button type="button" id="bgmBtn" class="bgm-btn" aria-label="배경음악" title="배경음악">♪</button>
          <button type="button" id="bgmNextBtn" class="bgm-btn" aria-label="다음 곡" title="다음 곡">⏭</button>
        </div>
        <div id="hud" class="hud hidden">
          <div class="hud-user">
            <span id="nick"></span>
            <button type="button" id="logoutBtn" class="logout-btn" aria-label="로그아웃" title="로그아웃">⎋</button>
          </div>
          <button type="button" id="point" class="point point-btn" title="포인트 구매"></button>
        </div>
      </div>
    </header>

    <div id="notifyPanel" class="notify-panel hidden" aria-hidden="true"></div>

    <audio id="bgm" preload="none"></audio>

    <main id="app" class="app"></main>

    <div id="overlay" class="overlay hidden"></div>

    <nav id="nav" class="nav hidden">
      <button data-tab="home" class="active">홈</button>
      <button data-tab="play">놀기</button>
      <button data-tab="rank">랭킹</button>
      <button data-tab="chat">채팅</button>
      <button data-tab="pet">펫</button>
      <button data-tab="job">직업</button>
      <button data-tab="dungeon">던전</button>
      <button data-tab="shop">상점</button>
      <button data-tab="bag">가방</button>
    </nav>
  </div>
  <script src="/js/app.js"></script>
</body>
</html>
