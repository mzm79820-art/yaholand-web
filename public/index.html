<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a3a2f" />
  <title>야호랜드</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="phone">
    <header class="top">
      <div class="brand">야호랜드</div>
      <div class="top-right">
        <button type="button" id="bgmBtn" class="bgm-btn" aria-label="배경음악" title="배경음악">♪</button>
        <div id="hud" class="hud hidden">
          <span id="nick"></span>
          <span id="point" class="point"></span>
        </div>
      </div>
    </header>

    <audio id="bgm" src="/audio/bgm.mp3" loop preload="auto"></audio>

    <main id="app" class="app"></main>

    <nav id="nav" class="nav hidden">
      <button data-tab="home" class="active">홈</button>
      <button data-tab="play">놀기</button>
      <button data-tab="pet">펫</button>
      <button data-tab="job">직업</button>
      <button data-tab="dungeon">던전</button>
      <button data-tab="shop">상점</button>
    </nav>
  </div>
  <script src="/js/app.js"></script>
</body>
</html>
